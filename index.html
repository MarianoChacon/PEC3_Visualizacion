<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEC 3 Visualización de datos</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="jumbotron text-center">
        <h1>Visualización de datos: PEC 3</h1>
        <p>Mariano Francisco Chacón Fernández</p> 
    </div>
    <!-- Contenedor de los filtros -->
    <div class="mb-3">
        <label for="filtroPais" class="form-label">Filtrar por País:</label>
        <select id="filtroPais" class="form-select d-inline-block w-auto">
            <option value="todos">Todos los países</option>
            <!-- Los países se cargarán aquí dinámicamente -->
        </select>
    </div>


    <!-- Todo dentro de un mismo container para mantener el orden -->
    <div class="container mt-5">
        <div class="row">
            <h1 style="text-align: center" >¿Son más rentables los hoteles sin niños?</h1>
            
            
            <div class="d-flex justify-content-center gap-2 mb-4">
                <button id="btnCancelados" class="btn btn-danger mb-3">Reservas canceladas</button>
                <button id="btnSoloNoCanceladas" class="btn btn-outline-success">Ver solo No Canceladas</button>
                <button id="btnCambiarMetrica" class="btn btn-info">Cambiar a ADR / Estancia</button>
            </div>
            
            <div style="position: relative; width: 800px; margin: 0 auto; border: 2px solid #000; border-radius: 15px; padding: 20px; margin-bottom: 80px;background-color: #fff">
                
                <div id="chart1" style="width: 100%; height: 450px; background-color: #fff"></div>
                <p style="text-align: right; font-style: italic; font-size: 0.85em; margin: 10px 0 0 0; color: #555;">
                Fuente:.
                </p>
            </div>
        </div>

    </div> <!-- Fin del container -->


    <!-- Bootstrap -->
    <script src="https://cloudflare.com"></script>  
    <!-- Apache ECharts-->
    <script src="echarts.min.js"></script>
    <!-- JavaScript -->
    <script src="main_2.js"></script>
</body>
</html>
