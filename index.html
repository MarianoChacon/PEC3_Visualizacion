<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEC 3 Visualización de datos</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="jumbotron text-center">
        <h1>Visualización de datos: PEC 3</h1>
        <p>Mariano Francisco Chacón Fernández</p> 
    </div>
    <!-- Contenedor de los filtros -->
    <div class="controls">
        <label for="categoryFilter">Filtrar por categoría:</label>
            <select id="miFiltro">
                <!-- Se llenará dinámicamente -->
            </select>
    </div>


    <!-- Todo dentro de un mismo container para mantener el orden -->
    <div class="container mt-5">
        <div class="row">
            <h1 style="text-align: center" >¿Son más rentables los hoteles sin niños?</h1>
            <button id="botonMostrar">Ocultar / Mostrar Gráfico</button>

            <div id="contenedorGrafico">
                <div id="chart2" style="width: 100%; height: 500px;"></div>
            </div>
            <div style="position: relative; width: 800px; margin: 0 auto; border: 2px solid #000; border-radius: 15px; padding: 20px; margin-bottom: 80px;background-color: #fff">
                
                <div id="chart1" style="width: 100%; height: 450px; background-color: #fff"></div>
                <p style="text-align: right; font-style: italic; font-size: 0.85em; margin: 10px 0 0 0; color: #555;">
                Fuente:.
                </p>
            </div>
        </div>

    </div> <!-- Fin del container -->


    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>   
    <!-- Apache ECharts-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/6.0.0/echarts.min.js"></script>
    <!-- JavaScript -->
    <script src="main_2.js"></script>
</body>
</html>
